name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  authors:
    name: Commit authors use a GitHub no-reply address
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit in the push
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~20..HEAD"
          fi
          bad=$(git log --format='%h %ae %ce' "$RANGE" 2>/dev/null | awk '$2 !~ /@users\.noreply\.github\.com$/ || $3 !~ /@users\.noreply\.github\.com$/' || true)
          if [ -n "$bad" ]; then
            echo "Commits with a personal identity (use the project no-reply address):"; echo "$bad"; exit 1
          fi
          echo "ok"

  build:
    name: Build (debug key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -eu
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - run: JAVA_HOME=$JAVA_HOME sh app/build.sh
      - name: Unit tests (HTTP layer)
        run: JAVA_HOME=$JAVA_HOME sh app/test.sh
