name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing here writes to the repository or needs a secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a run that is still going. Not on main: the author
  # check covers the commits of one push, so a run cancelled there would
  # leave that push's commits unchecked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Named explicitly, GitHub runs bash with -eo pipefail: a failing command
    # in a pipeline fails the step.
    shell: bash

jobs:
  authors:
    name: Commit authors use a GitHub no-reply address
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit in the push
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ]; then
            range="$BEFORE..$HEAD_SHA"
          fi
          # No range (a new branch has no "before"), or one that cannot be
          # read (a force-push removed its start), must not pass as "nothing
          # to check", and the last few commits are not all of a new branch:
          # check the whole history then.
          format='%h%x09%an%x09%ae%x09%cn%x09%ce'
          if [ -n "$range" ] && git rev-list "$range" >/dev/null 2>&1; then
            commits=$(git log --format="$format" "$range")
          else
            commits=$(git log --format="$format" HEAD)
          fi
          # Fields: hash, author name, author email, committer name, committer
          # email. The addresses must be GitHub no-reply ones; GitHub itself
          # commits merges made on github.com (noreply@github.com), which is
          # not a personal identity. The project's own address must carry the
          # project's name, so a real name cannot ride along with it.
          bad=$(printf '%s\n' "$commits" | awk -F'\t' '
            NF == 0 { next }
            $3 !~ /@users\.noreply\.github\.com$/ { print $1 " author address"; next }
            $5 !~ /@users\.noreply\.github\.com$/ && $5 != "noreply@github.com" { print $1 " committer address"; next }
            $3 ~ /(^|\+)braviafanboy@users\.noreply\.github\.com$/ && $2 != "braviafanboy" { print $1 " author name"; next }
            $5 ~ /(^|\+)braviafanboy@users\.noreply\.github\.com$/ && $4 != "braviafanboy" { print $1 " committer name"; next }
          ')
          if [ -n "$bad" ]; then
            # Only the commit and the field: this log is public too.
            echo "Commits with a personal identity (use the project no-reply address and name):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "ok: $(printf '%s\n' "$commits" | grep -c .) commit(s) checked"

  build:
    name: Build, unit tests and API levels (debug key)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK packages and the JDK are pinned in app/toolchain.env, which
      # the build scripts read too.
      - name: Read the pinned JDK version
        id: toolchain
        run: |
          set -eu
          . app/toolchain.env
          echo "jdk=$JDK_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.jdk }}
      - name: Android SDK (pinned platform and build-tools)
        run: sh .github/scripts/android-sdk.sh
      - name: Build
        run: sh app/build.sh
      - name: Unit tests
        run: sh app/test.sh
      - name: Build the settings-dump tool
        run: sh tools/settings-dump/build.sh
      # Last, so that the steps above still report when this one fails.
      - name: No Android API newer than minSdkVersion without a review
        run: python3 tools/apicheck.py
