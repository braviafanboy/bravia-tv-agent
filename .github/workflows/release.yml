name: Release

# Builds, tests, signs and publishes bravia-agent.apk for a version tag (v1.2.3).
#
# Two jobs, so that the signing key and the right to publish are never in the
# same place:
#   build    reads the repository and holds the signing key; its token cannot
#            write anything.
#   publish  may create the release; it is given no secret and runs nothing
#            from the repository, only the files the build job hands over.
#
# The build job needs two secrets:
#   AGENT_KEYSTORE_B64   release.keystore, base64-encoded
#   AGENT_KEYSTORE_PASS  its password
# and runs in the "release" environment. It reads them the same way whether
# they are repository secrets or secrets of that environment, but repository
# secrets can be read by any workflow on any branch. To keep the key to
# approved release runs, store them as secrets of the environment and give
# the environment a required reviewer and a deployment rule for "v*" tags.
# Those are repository settings: nothing in this file can set or check them.
# The same key must sign every release, or Android refuses in-place updates;
# app/release-signer.sha256 pins its certificate.

on:
  push:
    tags: ["v*"]

# Nothing by default: each job states what it needs.
permissions: {}

# One run per tag, and a release that is under way is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Named explicitly, GitHub runs bash with -eo pipefail: a failing command
    # in a pipeline fails the step.
    shell: bash

jobs:
  build:
    name: Check, build and sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history with every tag: the version code is compared
          # with the earlier releases.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version, the version code and the changelog
        run: |
          set -eu
          fail() { echo "::error::$*"; exit 1; }
          attribute() { sed -n "s/.*android:$1=\"\([^\"]*\)\".*/\1/p"; }

          tag=$GITHUB_REF_NAME
          version=${tag#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "the tag must look like v1.2.3, not $tag"

          name=$(attribute versionName < app/AndroidManifest.xml)
          code=$(attribute versionCode < app/AndroidManifest.xml)
          [ "$name" = "$version" ] || fail "tag $tag, but versionName in the manifest is '$name'"
          [[ $code =~ ^[0-9]+$ ]] || fail "versionCode in the manifest is not a number: '$code'"

          # Android installs an update only over a lower version code, so this
          # one has to be above that of every release tag there is.
          highest=0
          highest_tag=""
          for other in $(git tag --list 'v*'); do
            [ "$other" != "$tag" ] || continue
            other_code=$(git show "$other:app/AndroidManifest.xml" | attribute versionCode)
            [[ $other_code =~ ^[0-9]+$ ]] || fail "cannot read the versionCode at tag $other"
            if [ "$other_code" -gt "$highest" ]; then
              highest=$other_code
              highest_tag=$other
            fi
          done
          [ -n "$highest_tag" ] || fail "found no earlier release tag to compare the versionCode with"
          [ "$code" -gt "$highest" ] || fail "versionCode $code is not above $highest (tag $highest_tag)"

          # The release notes: the changelog section whose heading is exactly
          # "## <version>", up to the next "## " heading.
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" \
            || fail "CHANGELOG.md has no \"## $version\" section, or the section is empty"

          echo "version $version, versionCode $code (highest before: $highest at $highest_tag). Release notes:"
          cat "$RUNNER_TEMP/release-notes.md"

      # The SDK packages and the JDK are pinned in app/toolchain.env, which
      # the build scripts read too.
      - name: Read the pinned JDK version
        id: toolchain
        run: |
          set -eu
          . app/toolchain.env
          echo "jdk=$JDK_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.jdk }}

      - name: Unit tests
        run: sh app/test.sh

      - name: Android SDK (pinned platform and build-tools)
        run: sh .github/scripts/android-sdk.sh

      - name: Build and sign
        env:
          AGENT_KEYSTORE_B64: ${{ secrets.AGENT_KEYSTORE_B64 }}
          AGENT_KEYSTORE_PASS: ${{ secrets.AGENT_KEYSTORE_PASS }}
        run: |
          set -eu
          if [ -z "$AGENT_KEYSTORE_B64" ] || [ -z "$AGENT_KEYSTORE_PASS" ]; then
            echo "::error::the signing secrets are not available to this job"
            exit 1
          fi
          # The key is on disk for this step only, readable by this user only,
          # and removed however the step ends. app/build.sh takes the password
          # from the environment and never puts it on a command line.
          keys=$RUNNER_TEMP/signing
          trap 'rm -rf "$keys"' EXIT
          (
            umask 077
            mkdir -p "$keys"
            printf '%s' "$AGENT_KEYSTORE_B64" | base64 -d > "$keys/release.keystore"
          )
          unset AGENT_KEYSTORE_B64
          AGENT_KEYSTORE=$keys/release.keystore sh app/build.sh

      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Check that the release key signed the APK
        run: |
          set -eu
          . app/toolchain.env
          expected=$(grep -v '^#' app/release-signer.sha256 | tr -d '[:space:]')
          [[ $expected =~ ^[0-9a-f]{64}$ ]] || { echo "::error::app/release-signer.sha256 does not hold one SHA-256"; exit 1; }
          # Fails by itself if the signature does not verify.
          certs=$("$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs app/build/bravia-agent.apk)
          signers=$(printf '%s\n' "$certs" | sed -n 's/^Signer .*certificate SHA-256 digest: //p')
          echo "signer certificate SHA-256: $signers"
          if [ "$signers" != "$expected" ]; then
            echo "::error::the APK is not signed by the one certificate in app/release-signer.sha256"
            exit 1
          fi

      - name: No Android API newer than minSdkVersion without a review
        run: python3 tools/apicheck.py

      - name: Write the update manifest
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          apk=app/build/bravia-agent.apk
          # The agent checks its download against this hash, so it has to be
          # a hash, and the one of this APK.
          sha=$(cat "$apk.sha256")
          actual=$(sha256sum "$apk")
          actual=${actual%% *}
          if ! [[ $sha =~ ^[0-9a-f]{64}$ ]] || [ "$sha" != "$actual" ]; then
            echo "::error::$apk.sha256 is not the SHA-256 of the APK"
            exit 1
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/bravia-agent.apk"
          python3 - "$version" "$url" "$sha" "$RUNNER_TEMP/release-notes.md" > app/build/agent.json <<'PY'
          import json, sys
          version, url, sha256, notes_file = sys.argv[1:5]
          with open(notes_file, encoding="utf-8") as f:
              notes = f.read().strip()
          if not notes:
              sys.exit("the release notes are empty")
          print(json.dumps({"version": version, "url": url, "sha256": sha256, "notes": notes}, indent=2))
          PY
          cat app/build/agent.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            app/build/bravia-agent.apk
            app/build/bravia-agent.apk.sha256
            app/build/agent.json
          if-no-files-found: error
          # A re-run of this job replaces what the attempt before it left.
          overwrite: true
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Check the files and publish them
        env:
          # This job's own token (contents: write), the only credential here.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd release
          for file in bravia-agent.apk bravia-agent.apk.sha256 agent.json; do
            [ -s "$file" ] || { echo "::error::the build job did not hand over $file"; exit 1; }
          done
          sum=$(sha256sum bravia-agent.apk)
          sum=${sum%% *}
          if [ "$sum" != "$(cat bravia-agent.apk.sha256)" ] || [ "$sum" != "$(jq -er .sha256 agent.json)" ] \
            || [ "${GITHUB_REF_NAME#v}" != "$(jq -er .version agent.json)" ]; then
            echo "::error::the APK, its .sha256 and agent.json do not agree"
            exit 1
          fi
          # gh uploads the files to a draft and publishes it when all three are
          # there; it stops if the release exists already.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            bravia-agent.apk bravia-agent.apk.sha256 agent.json
