version: 2
updates:
  # The workflows pin each action to a commit, with its version in a comment
  # on the same line; Dependabot proposes every new release and updates both.
  # Its commits pass the CI author check (a GitHub no-reply address, with
  # GitHub's own committer address), so its pull requests can be merged as
  # they are.
  #
  # Dependabot has nothing to follow for the rest of the toolchain: the
  # Android SDK packages and the JDK (app/toolchain.env) and Google's
  # command-line tools (.github/scripts/android-sdk.sh) are updated by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
